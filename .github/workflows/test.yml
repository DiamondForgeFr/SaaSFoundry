name: Tests

on:
  push:
    branches: [master, develop, 'rc-*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [master, develop]

# Returning a PR to draft cancels the previous validation run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  # The docs site is only built by deploy-docs.yml, which runs on master pushes and v* tags.
  # develop is hundreds of commits ahead of master, so a broken docs build stayed invisible
  # until release time — and would have failed the v1.0.0 deploy rather than a PR. Build it
  # here so it breaks on the PR that breaks it.
  docs:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build

  coverage:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx jest --coverage --coverageReporters=lcov --coverageReporters=text-summary
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # The matrix is read from tests/docker/scenarios.ts, never copied here.
  #
  # It used to be a hand-written list of names, and it drifted exactly the way the shell
  # script's `--list` drifted before #426: two scenarios (`migration-v0-to-current` and
  # `multirepo-pwa`) were defined, runnable locally, and ran on no pull request at all.
  # Deriving the list means a scenario cannot be added to the code and silently left out.
  docker-scenarios:
    name: Resolve docker scenarios
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    outputs:
      full: ${{ steps.resolve.outputs.full }}
      quick: ${{ steps.resolve.outputs.quick }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: resolve
        run: |
          echo "full=$(npx -y tsx tests/docker/list-scenarios.ts --json)" >> "$GITHUB_OUTPUT"
          echo "quick=$(npx -y tsx tests/docker/list-scenarios.ts --json --quick)" >> "$GITHUB_OUTPUT"

  # PR → master: every scenario the code defines
  docker-build-tests-full:
    name: Docker Build (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    needs: docker-scenarios
    if: github.event_name == 'pull_request' && github.base_ref == 'master' && !github.event.pull_request.draft
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.docker-scenarios.outputs.full) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          load: true
          tags: sf-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run scenario
        run: docker run --rm -e TEST_SCENARIO=${{ matrix.scenario }} sf-test:latest

  # PR → develop: the quick lane — top 2 by priority, plus any scenario that opts in
  # with `quick` in scenarios.ts (cheap, and guarding something damaging).
  docker-build-tests-quick:
    name: Docker Build (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    needs: docker-scenarios
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && !github.event.pull_request.draft
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.docker-scenarios.outputs.quick) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test
          load: true
          tags: sf-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run scenario
        run: docker run --rm -e TEST_SCENARIO=${{ matrix.scenario }} sf-test:latest
